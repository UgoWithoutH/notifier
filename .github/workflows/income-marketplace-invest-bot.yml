name: Income Marketplace Invest Bot

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: income-marketplace-invest-bot
  cancel-in-progress: false

jobs:
  income-marketplace:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v2-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium (cache miss only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Restore persisted state (session + cron schedule + missing-loans state)
        uses: actions/cache/restore@v4
        with:
          path: |
            monitors/income_marketplace_invest_state.json
            monitors/income_marketplace_cron_schedule_state.json
            monitors/income_marketplace_invest_storage_state.json
          key: income-marketplace-invest-state-${{ github.run_id }}
          restore-keys: |
            income-marketplace-invest-state-

      - name: Run Income Marketplace invest bot
        env:
          INCOME_MARKETPLACE_EMAIL: ${{ secrets.INCOME_MARKETPLACE_EMAIL }}
          INCOME_MARKETPLACE_PASSWORD: ${{ secrets.INCOME_MARKETPLACE_PASSWORD }}
          INCOME_MARKETPLACE_TOTP_SECRET: ${{ secrets.INCOME_MARKETPLACE_TOTP_SECRET }}
          INCOME_MARKETPLACE_BOT_MODE: ${{ vars.INCOME_MARKETPLACE_BOT_MODE || 'dry' }}
          CRON_JOB_API_KEY: ${{ secrets.CRON_JOB_API_KEY }}
          INCOME_MARKETPLACE_CRON_JOB_ID: ${{ secrets.INCOME_MARKETPLACE_CRON_JOB_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m monitors.income_marketplace_invest_bot

      - name: Save persisted state (session + cron schedule + missing-loans state) for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            monitors/income_marketplace_invest_state.json
            monitors/income_marketplace_cron_schedule_state.json
            monitors/income_marketplace_invest_storage_state.json
          key: income-marketplace-invest-state-${{ github.run_id }}
