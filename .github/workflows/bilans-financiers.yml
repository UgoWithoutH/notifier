name: Bilans financiers P2P

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulation : n'écrit rien dans le Google Sheet"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bilans-financiers
  cancel-in-progress: false

jobs:
  bilans:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Sync bilans financiers into Google Sheet
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python -m scripts.sync_bilans_financiers
